# Defaults for this playbook. Run every command from the ansible/ directory.

[defaults]
inventory = inventory.yml
roles_path = roles
# No vault_password_file here on purpose: naming a file that is not committed
# would break `make provision-lint`, which needs no secrets. The targets that
# do connect pass --vault-password-file themselves.
host_key_checking = True
# The old `yaml` callback lived in community.general and was removed there; this
# is the same readable output, built into ansible-core.
stdout_callback = default
result_format = yaml
display_skipped_hosts = False
interpreter_python = auto_silent
retry_files_enabled = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
