---
# Base packages, the deploy user's environment and the limits the JVM needs.

common_packages:
  - ca-certificates
  - cron # the nightly BlueMap window
  - curl
  - git
  - jq # `make modpack` resolves the client-only mods through the Modrinth API
  - make
  - zip
  - ufw
  - unattended-upgrades
  - rsync

# Not a substitute for RAM, but it stops a spike from killing the JVM.
common_swap_gb: 4

# Minecraft opens a lot of region files and the JVM maps many at once
common_nofile_limit: 65535

# Declared, not read back, so --check works before the account exists.
common_deploy_home: /home/{{ deploy_user }}
