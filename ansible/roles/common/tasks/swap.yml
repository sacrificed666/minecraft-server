---
- name: 📦 Setup | Swap file
  ansible.builtin.command: fallocate -l {{ swap_gb }}G /swapfile
  args:
    creates: /swapfile
  register: swap_created

- name: 🔒 Harden | Swap file permissions
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"

- name: ⚙️ Config | Format the swap file
  ansible.builtin.command: mkswap /swapfile
  when: swap_created.changed
  changed_when: true

- name: ⚙️ Config | Swap in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
    state: present

- name: 🔍 Check | Active swap
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: active_swap
  changed_when: false

- name: ⚙️ Config | Enable swap now
  ansible.builtin.command: swapon /swapfile
  when: "'/swapfile' not in active_swap.stdout"
  changed_when: true
