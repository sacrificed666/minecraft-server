---
# Swap file: created once, formatted once, enabled now and at boot.

- name: 📦 Setup | Swap file
  ansible.builtin.command: fallocate -l {{ common_swap_gb }}G /swapfile
  args:
    creates: /swapfile

- name: 🔒 Harden | Swap file readable by root only
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"

# Keyed on the file having no signature rather than on this run having created
# it: a run that died between fallocate and mkswap would otherwise never format.
- name: 🔍 Check | Swap file already formatted
  ansible.builtin.command: blkid -p -s TYPE -o value /swapfile
  register: common_swap_type
  changed_when: false
  failed_when: false

- name: ⚙️ Config | Format the swap file
  ansible.builtin.command: mkswap /swapfile
  when: common_swap_type.stdout != "swap"
  changed_when: true

- name: ⚙️ Config | Swap in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: /swapfile none swap sw 0 0
    state: present

- name: 🔍 Check | Active swap
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: common_active_swap
  changed_when: false

- name: ⚙️ Config | Enable swap now
  ansible.builtin.command: swapon /swapfile
  when: "'/swapfile' not in common_active_swap.stdout"
  changed_when: true
