---
# Timezone, the packages the stack needs, and automatic security updates.

- name: 🔍 Check | Current timezone
  ansible.builtin.command: timedatectl show --property=Timezone --value
  register: common_timezone
  changed_when: false

- name: ⚙️ Config | Timezone
  ansible.builtin.command: timedatectl set-timezone {{ timezone }}
  when: common_timezone.stdout != timezone
  changed_when: true

- name: 📦 Setup | Packages the stack needs
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: ⚙️ Config | Unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
