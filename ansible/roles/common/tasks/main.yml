---
# Host baseline, split by concern. Order matters: the deploy user exists before
# the hardening role locks SSH down to key-only logins.

- name: ⚙️ Config | System defaults
  ansible.builtin.include_tasks: system.yml

- name: 📦 Setup | Deploy user
  ansible.builtin.include_tasks: user.yml

- name: ⚙️ Config | Swap
  ansible.builtin.include_tasks: swap.yml
  when: common_swap_gb | int > 0
