---
# Only ansible.builtin is used throughout the whole playbook, so nothing has to
# be installed from Galaxy before it will run.

- name: 🔍 Check | Current timezone
  ansible.builtin.command: timedatectl show --property=Timezone --value
  register: current_timezone
  changed_when: false

- name: ⚙️ Config | Timezone
  ansible.builtin.command: timedatectl set-timezone {{ timezone }}
  when: current_timezone.stdout != timezone
  changed_when: true

- name: 📦 Setup | Packages the stack needs
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: 🔒 Harden | Unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: 📦 Setup | Deployment user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: ⚙️ Config | Swap
  ansible.builtin.include_tasks: swap.yml
  when: swap_gb | int > 0

- name: ⚙️ Config | File descriptor limits
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-minecraft.conf
    mode: "0644"
    content: |
      {{ deploy_user }} soft nofile {{ nofile_limit }}
      {{ deploy_user }} hard nofile {{ nofile_limit }}
