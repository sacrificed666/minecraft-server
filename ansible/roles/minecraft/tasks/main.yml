---
# Runs entirely as the deploy user. Secrets are generated on the host by
# `make init` and never read back — Ansible and CI never see them.

- name: 🔍 Check | deploy_repo is set
  ansible.builtin.assert:
    that: deploy_repo | default("") | length > 0
    fail_msg: Set deploy_repo in group_vars — the role has no sensible default for it.

# Owned up front, so the checkout needs no recursive chown over server/data
- name: 📦 Setup | Deployment directory
  ansible.builtin.file:
    path: "{{ deploy_path }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

# force discards local edits to tracked files; .env and server/ are git-ignored
- name: 🚀 Deploy | Check out the repository
  become_user: "{{ deploy_user }}"
  ansible.builtin.git:
    repo: "{{ deploy_repo }}"
    dest: "{{ deploy_path }}"
    version: "{{ deploy_branch }}"
    force: true

- name: 🔍 Check | Existing .env
  ansible.builtin.stat:
    path: "{{ deploy_path }}/.env"
  register: minecraft_env_file

- name: 📦 Setup | Generate .env secrets on first deploy
  become_user: "{{ deploy_user }}"
  ansible.builtin.command: make init
  args:
    chdir: "{{ deploy_path }}"
  when: not minecraft_env_file.stat.exists
  changed_when: true

- name: ⚙️ Config | Hostnames and gameplay overrides
  become_user: "{{ deploy_user }}"
  ansible.builtin.lineinfile:
    path: "{{ deploy_path }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop: "{{ minecraft_env_overrides | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: 🔍 Check | EULA accepted
  ansible.builtin.command: grep -q '^EULA=TRUE' {{ deploy_path }}/.env
  register: minecraft_eula
  changed_when: false
  failed_when: false

- name: 🔍 Check | Stop unless the EULA is accepted
  ansible.builtin.assert:
    that: minecraft_eula.rc == 0
    fail_msg: >-
      EULA is not TRUE in {{ deploy_path }}/.env. Accepting Minecraft's EULA is
      a decision for a person, not a playbook — set it and run again.

- name: 🚀 Deploy | Start the stack
  become_user: "{{ deploy_user }}"
  ansible.builtin.command: docker compose up -d --build
  args:
    chdir: "{{ deploy_path }}"
  register: minecraft_compose
  changed_when: "'Started' in minecraft_compose.stderr or 'Created' in minecraft_compose.stderr"

- name: 🚀 Deploy | Start Traefik
  become_user: "{{ deploy_user }}"
  ansible.builtin.command: docker compose --profile proxy up -d proxy
  args:
    chdir: "{{ deploy_path }}"
  register: minecraft_proxy
  changed_when: "'Started' in minecraft_proxy.stderr or 'Created' in minecraft_proxy.stderr"
  when: minecraft_enable_proxy

- name: ⏰ Schedule | Nightly jobs
  ansible.builtin.include_tasks: cron.yml

# The mods only exist after a first boot, so this must not fail the deployment
- name: 🎁 Build | Player modpack
  become_user: "{{ deploy_user }}"
  ansible.builtin.command: make modpack
  args:
    chdir: "{{ deploy_path }}"
  changed_when: true
  failed_when: false

- name: 📊 Report | Where everything lives
  ansible.builtin.debug:
    msg:
      - "Minecraft: {{ ansible_host }}:25565"
      - "Panel:     https://{{ minecraft_env_overrides.ADMIN_HOST | default('see .env') }}"
      - "Map:       https://{{ minecraft_env_overrides.MAP_HOST | default('see .env') }}"
      - "Password:  ssh in and run `make admin-password`"
