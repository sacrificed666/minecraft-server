---
# The deployment itself. What is deployed and where: group_vars/all/main.yml.

# Start Traefik as well. Set false to run without TLS termination.
minecraft_enable_proxy: true

# Written into .env on the host after `make init` has generated the secrets.
minecraft_env_overrides: {}

# The nightly BlueMap window, in the host timezone.
minecraft_map_render_cron: { hour: 4, minute: 0 }
minecraft_map_pause_cron: { hour: 8, minute: 0 }

# 0 renders the whole world, pre-generated wilderness included; 1 keeps the map
# to where players have actually been, and it grows as they explore.
minecraft_map_min_inhabited_time: 1

minecraft_cron_log: /var/log/minecraft-cron.log
