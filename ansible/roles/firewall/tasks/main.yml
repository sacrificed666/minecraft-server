---
# Ports are allowed before anything is denied, so the run cannot lock itself out.

# ufw reports success whether or not it changed anything, so state is read once
# and the tasks below run only on a difference.
- name: 🔍 Check | Current ufw state
  ansible.builtin.command: ufw status verbose
  register: firewall_state
  changed_when: false

- name: ⚙️ Config | Allow SSH, the game and the web ports
  ansible.builtin.command: ufw allow {{ item }}
  loop: "{{ [(ansible_port | default(22)) ~ '/tcp'] + firewall_open_ports }}"
  register: firewall_rule
  changed_when: "'Rule added' in firewall_rule.stdout"

- name: 🔒 Harden | Default deny incoming
  ansible.builtin.command: ufw default deny incoming
  when: "'deny (incoming)' not in firewall_state.stdout"
  changed_when: true

- name: ⚙️ Config | Default allow outgoing
  ansible.builtin.command: ufw default allow outgoing
  when: "'allow (outgoing)' not in firewall_state.stdout"
  changed_when: true

- name: ⚙️ Config | Enable ufw
  ansible.builtin.command: ufw --force enable
  when: "'Status: active' not in firewall_state.stdout"
  changed_when: true

- name: 📊 Report | Docker bypasses ufw
  ansible.builtin.debug:
    msg: >-
      ufw does not filter Docker-published ports. Anything bound to 0.0.0.0 in
      compose.yaml is reachable regardless of these rules.
