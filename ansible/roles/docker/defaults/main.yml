---
# Docker Engine from upstream — the distro package lags and has no Compose v2.

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# compose.yaml caps logs per service; this covers containers started outside it
docker_log_max_size: 20m
docker_log_max_file: "5"
