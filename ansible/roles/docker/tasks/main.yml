---
# Docker Engine, the Compose plugin and daemon-wide log limits.

- name: 📦 Setup | apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: 📦 Setup | Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: ⚙️ Config | Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts.distribution_release }}"
    components: [stable]
    architectures:
      - "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"
    signed_by: /etc/apt/keyrings/docker.asc
    enabled: true
    state: present

- name: 📦 Setup | Docker Engine and Compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: ⚙️ Config | Cap daemon-wide log size
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "{{ docker_log_max_size }}",
          "max-file": "{{ docker_log_max_file }}"
        }
      }
  notify: ♻️ Restart | docker

- name: ⚙️ Config | Start Docker and enable at boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

# Membership in the docker group is root in practice — only the deploy user has it
- name: 📦 Setup | Deploy user in the docker group
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true
