---
# Takes a fresh Ubuntu host to a running stack.
#
# Takes a fresh Ubuntu host to a running stack. Every task is idempotent.

- name: ⛏️ Minecraft | Server host
  hosts: all
  become: true

  pre_tasks:
    - name: 🔍 Check | Host runs Ubuntu
      ansible.builtin.assert:
        that: ansible_facts.distribution == "Ubuntu"
        fail_msg: >-
          This playbook targets Ubuntu 26.04. Found
          {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.
      tags: [always]

  # Order matters — see the three load-bearing orderings in README.md.
  roles:
    - role: common
      tags: [common]
    - role: hardening
      tags: [hardening]
    - role: docker
      tags: [docker]
    - role: firewall
      tags: [firewall]
    - role: minecraft
      tags: [deploy]
