---
# Takes a fresh Ubuntu host to a running stack. Every task is idempotent.
# Layout, variables and conventions: see README.md.
#
#   ansible-playbook site.yml                 # provision and deploy
#   ansible-playbook site.yml --tags deploy   # pull and restart only

- name: ⛏️ Minecraft | Server host
  hosts: all
  become: true

  pre_tasks:
    - name: 🔍 Check | Host runs Ubuntu
      ansible.builtin.assert:
        that: ansible_facts.distribution == "Ubuntu"
        fail_msg: >-
          This playbook targets Ubuntu 26.04. Found
          {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.
      tags: [always]

  # Order matters: hardening locks SSH down to the key common installs, and
  # both firewall and minecraft need packages the earlier roles put there.
  roles:
    - role: common
      tags: [common]
    - role: hardening
      tags: [hardening]
    - role: docker
      tags: [docker]
    - role: firewall
      tags: [firewall]
    - role: minecraft
      tags: [deploy]
