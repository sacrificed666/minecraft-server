---
# Values more than one role reads.

timezone: Europe/Kyiv

# The host account's password, for sudo.
ansible_become_password: "{{ vault_server_password }}"

# The unprivileged account that owns the checkout and runs Docker
deploy_user: minecraft

# What is deployed, from where, and to which directory
deploy_repo: https://github.com/sacrificed666/minecraft-server.git
deploy_branch: main
deploy_path: /opt/minecraft-server
