# BlueMap's integrated web server.
#
# Bound to all interfaces inside the container only — the port is published to
# loopback on the host, and Traefik terminates TLS in front of it. Nothing here
# is reachable from the internet except through the proxy.

enabled: true

webroot: "bluemap/web"

port: 8100

ip: "0.0.0.0"
