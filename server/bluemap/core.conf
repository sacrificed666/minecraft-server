# BlueMap core configuration, mounted read-only over the generated default.
#
# accept-download MUST be true or BlueMap renders nothing: it needs the
# Minecraft client jar from Mojang for block models and textures, and it
# refuses to fetch that without explicit consent. The default is false, so a
# server that never sets it looks like a silent BlueMap failure.

accept-download: true

# Where render data and progress live, relative to the config directory
data: "bluemap"

# Rendering is CPU-hungry and competes with the server tick. Negative values
# subtract from the core count: -4 leaves 4 cores free on a 6-core host.
render-thread-count: 1

# Nothing needs to phone home from a private server
metrics: false

# Scan for new worlds without a restart
scan-for-mod-resources: true
