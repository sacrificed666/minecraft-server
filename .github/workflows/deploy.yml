name: 🚀 Deploy | Minecraft stack

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        required: true
        default: admin
        options:
          - admin # rebuild the panel; players stay connected
          - stack # recreate every service; the server restarts
          - modpack # rebuild the player modpack only
      rebuild_modpack:
        description: Also rebuild the modpack
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    name: 🔍 Check | Panel, compose and playbook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Setup | Check out the repository
        uses: actions/checkout@v7

      - name: 📦 Setup | Node and dependencies
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: 📦 Setup | Install
        working-directory: admin
        run: npm ci

      - name: 🧹 Lint | ESLint and React rules
        working-directory: admin
        run: npm run lint

      - name: 🏗️ Build | Next.js production build
        working-directory: admin
        env:
          SESSION_SECRET: build-time-placeholder-value
        run: npm run build

      - name: 🐳 Verify | compose.yaml resolves
        run: |
          make init
          make config

      - name: 🔧 Verify | Ansible playbook parses
        run: |
          pipx install ansible-core
          make provision-lint

  deploy:
    name: 📤 Apply | Server and panel
    needs: check
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/minecraft-server' }}
      TARGET: ${{ inputs.target }}
      MODPACK: ${{ inputs.rebuild_modpack }}
      BRANCH: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
    steps:
      - name: ⚙️ Deploy | Pull, apply and verify
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_PATH,TARGET,MODPACK,BRANCH,SHA
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            # Plain markers rather than ::group::, which only works when the
            # action passes remote output through unprefixed — and this way the
            # script reads the same when run by hand.
            echo "▸ checkout — the commit the checks passed on, not the tip"
            git fetch --prune origin
            git checkout "$BRANCH"
            git reset --hard "$SHA"
            git --no-pager log -1 --format='  now at %h %s (%an, %ar)'

            echo "▸ apply $TARGET"
            case "$TARGET" in
              admin)   make admin   ;;
              stack)   make rebuild ;;
              modpack) make modpack ;;
            esac
            if [ "$MODPACK" = true ] && [ "$TARGET" != modpack ]; then
              make modpack
            fi

            echo "▸ verify"
            make health
            make status

      - name: 📊 Report | Run summary
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" = success ]; then
            echo "::notice title=Deployed::$TARGET from $BRANCH at ${SHA:0:7}"
          else
            echo "::error title=Deploy failed::$TARGET at ${SHA:0:7} — see the step log"
          fi
          echo "### Deploy \`$TARGET\` — $OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$BRANCH\` @ \`${SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
